<div class="nonex-ist-od6s explosive-dialog">
    {{#if (eq stage 0) }}
        <div class="flexrow flex-group-left explosive-type">
            <label for="explosive-type">{{localize 'NONEX_IST_OD6S.TYPE'}}:</label>
            <select name="explosive-type" id="explosive-type" style="min-width: 70px; width: auto;">
                {{#each options as |option|}}
                    <option value="{{ option }}" {{#if (eq ../type option)}}selected{{/if}}>
                        {{localize option}}
                    </option>
                {{/each}}
            </select>
        </div>
    {{/if}}
    {{#if (eq stage 1) }}
        {{#if (eq type 'NONEX_IST_OD6S.EXPLOSIVE_TIMER')}}
            {{localize 'NONEX_IST_OD6S.EXPLOSIVE_TIMER'}}
        {{/if}}
        {{# if (eq type 'NONEX_IST_OD6S.EXPLOSIVE_TRIGGER')}}
            {{localize 'NONEX_IST_OD6S.EXPLOSIVE_TRIGGER'}}
        {{/if}}
    {{/if}}
    <input name="explosive-type" type="hidden" value="">
    <footer class="sheet-footer flexrow align-center-bottom form-footer">
        <button type="button" class="submit" data-action="submit">
            {{#if (and (eq stage 0)(isExplosivesAuto)) }}
                {{ localize 'NONEX_IST_OD6S.PLACE_TEMPLATE' }}
            {{else}}
                {{ localize 'NONEX_IST_OD6S.SUBMIT' }}
            {{/if}}
        </button>
    </footer>
</div>
