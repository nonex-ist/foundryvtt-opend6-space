<div class="nonex-ist-od6s-custom-fields">
    <p class="notes">{{localize "NONEX_IST_OD6S.CONFIG_CUSTOM_FIELDS_HINT"}}</p>

    {{#each fields}}
    <fieldset class="custom-field-card">
        <legend>{{localize "NONEX_IST_OD6S.CONFIG_CF_CARD"}} {{index}}</legend>
        <div class="cf-grid">
            <label for="{{nameKey}}">{{localize "NONEX_IST_OD6S.CONFIG_CF_NAME"}}</label>
            <input type="text" name="{{nameKey}}" id="{{nameKey}}" value="{{name}}"
                   placeholder="{{localize 'NONEX_IST_OD6S.CONFIG_CF_NAME_PLACEHOLDER'}}">

            <label for="{{shortKey}}">{{localize "NONEX_IST_OD6S.CONFIG_CF_SHORT"}}</label>
            <input type="text" name="{{shortKey}}" id="{{shortKey}}" value="{{short}}">

            <label for="{{typeKey}}">{{localize "NONEX_IST_OD6S.CONFIG_CF_TYPE"}}</label>
            <select name="{{typeKey}}" id="{{typeKey}}">
                {{selectOptions ../typeChoices selected=type}}
            </select>

            <label>{{localize "NONEX_IST_OD6S.CONFIG_CF_SHOW_ON"}}</label>
            <div class="cf-actors">
                <input type="hidden" name="{{actorTypesKey}}" value="{{mask}}">
                {{#each actors}}
                <label class="cf-actor">
                    <input type="checkbox" name="{{../actorTypesKey}}" value="{{type}}" {{#if checked}}checked{{/if}}>
                    {{label}}
                </label>
                {{/each}}
            </div>
        </div>
    </fieldset>
    {{/each}}

    <div class="submit">
        <span class="save-note"><i class="fas fa-circle-check"></i> {{localize "NONEX_IST_OD6S.SETTINGS_AUTOSAVE_NOTE"}}</span>
        <button type="button" name="close" data-action="closeForm">{{localize "Close"}}</button>
    </div>
</div>
