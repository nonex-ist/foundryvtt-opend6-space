<div>
    <div class="grid grid-2col">
        <div>
            <div class="grid grid-2col-species">
                <label for="actor.system.species.content">{{localize actor.system.species.label}}:</label>
                <input id="actor.system.species.content" title="{{localize actor.system.species.label}}" name="system.species.content" type="text"
                       value="{{actor.system.species.content}}" placeholder="{{localize actor.system.species.label}}"
                       data-dtype="{{actor.system.species.type}}"/>
            </div>
        </div>
    </div>
    <div class="grid grid-4col header-fields">
        <div class="flexrow flex-group-center">
            <label for="actor.system.move.value">{{localize actor.system.move.label}}:</label>
            <input id="actor.system.move.value" title="{{localize actor.system.move.label}}" name="system.move.value" type="number" min="0" max="99"
                   value="{{actor.system.move.value}}" placeholder="10" data-dtype="{{actor.system.move.type}}"/>
        </div>
        {{> (getWoundsTemplate)}}
        {{#each (getCustomFields actor.type)}}
            <div class="flexrow flex-group-center">
                <label>{{label}}:</label>
                <input aria-label="{{label}}" title="{{label}}" name="system.customfields.{{id}}" type="{{inputType}}"
                       value="{{lookup ../actor.system.customfields id}}" data-dtype="{{dtype}}"
                    {{#if (eq inputType "number") }}
                       min="0" max="9999" placeholder="0"
                    {{/if}}/>
            </div>
        {{/each}}
        <div class="flexrow flex-group-left">
            <label for="actor.system.scale.score">{{localize actor.system.scale.label}}:</label>
            <input id="actor.system.scale.score" title="{{localize actor.system.scale.label}}" name="system.scale.score" type="number" min="0" max="99"
                   value="{{actor.system.scale.score}}" placeholder="0" data-dtype="{{actor.system.scale.type}}"/>
        </div>
    </div>
</div>
