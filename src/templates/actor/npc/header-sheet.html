<div>
    <div class="grid grid-2col">
        <div>
            <div
                {{#if (eq actor.system.sheetmode.value "freeedit")}}
                class="grid grid-3col-type"
                {{else}}
                class="grid grid-2col-type"
                {{/if}}>
                <div class="flexrow flex-group-center">
                <label for="actor.system.chartype.content">{{localize actor.system.chartype.label}}:</label>
                <input title="{{localize actor.system.chartype.label}}" name="system.chartype.content" type="text"
                       value="{{actor.system.chartype.content}}" placeholder="{{localize actor.system.chartype.label}}"
                       data-dtype="{{actor.system.chartype.type}}"/>
            </div>
            </div>
        </div>
        <div>
            <div
                {{#if (eq actor.system.sheetmode.value "freeedit")}}
                class="grid grid-3col-species"
                {{else}}
                class="grid grid-2col-species"
                {{/if}}>
                <div class="flexrow flex-group-center">
                <label for="actor.system.species.content">{{localize actor.system.species.label}}:</label>
                <input title="{{localize actor.system.species.label}}" name="system.species.content" type="text"
                       value="{{actor.system.species.content}}" placeholder="{{localize actor.system.species.label}}"
                       data-dtype="{{actor.system.species.type}}"/>
                {{#if (eq actor.system.sheetmode.value "freeedit")}}
                    {{#if (displaySpeciesTemplateClear actor)}}
                        <button type="button" class="reset-species-template">{{localize 'NONEX_IST_OD6S.CLEAR'}}</button>
                    {{/if}}
                {{/if}}
                </div>
            </div>
        </div>
    </div>
    <div class="grid grid-4col header-fields">
        <div class="flexrow flex-group-center">
            <label for="actor.system.characterpoints.value">{{localize actor.system.characterpoints.short_label}}:</label>
            <input title="{{localize actor.system.characterpoints.label}}" name="system.characterpoints.value"
                   type="number" min="0" max="9999"
                   value="{{actor.system.characterpoints.value}}" placeholder="0"
                   data-dtype="{{actor.system.characterpoints.type}}"/>
        </div>
        <div class="flexrow flex-group-center">
            <label for="actor.system.fatepoints.value">{{getFatePointsShortName}}:</label>
            <input title="{{getFatePointsShortName}}" name="system.fatepoints.value" type="number"
                   min="0" max="9999" value="{{actor.system.fatepoints.value}}" placeholder="0"
                   data-dtype="{{actor.system.fatepoints.type}}"/>
            <div class="flexrow flex-group-left fatepointeffect"
                 title="{{localize 'NONEX_IST_OD6S.IN_EFFECT'}}">
                <label for="fpInEffect"></label>
                <input id="fpInEffect" type="checkbox"
                    {{#unless (gt actor.system.fatepoints.value 0) }}
                        {{#unless actor.flags.nonex-ist-od6s.fatepointeffect}}disabled{{/unless}}
                    {{/unless}}
                       data-dtype="Boolean" {{#if actor.flags.nonex-ist-od6s.fatepointeffect}}checked{{/if}}/>
            </div>
        </div>
        <div class="flexrow flex-group-center">
            <label for="actor.system.move.value">{{localize actor.system.move.label}}:</label>
            <input title="{{localize actor.system.move.label}}" name="system.move.value" type="number" min="0" max="99"
                   value="{{actor.system.move.value}}" placeholder="10" data-dtype="{{actor.system.move.type}}"/>
        </div>
        {{> (getWoundsTemplate)}}
        {{#each (getCustomFields actor.type)}}
            <div class="flexrow flex-group-center">
                <label for="actor.system.customfields.{{id}}">{{label}}:</label>
                <input title="{{label}}" name="system.customfields.{{id}}" type="{{inputType}}"
                       value="{{lookup ../actor.system.customfields id}}" data-dtype="{{dtype}}"
                    {{#if (eq inputType "number") }}
                       min="0" max="9999" placeholder="0"
                    {{/if}}/>
            </div>
        {{/each}}
    </div>
</div>
